name: CI & Paper Build

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  test:
    name: Test Suite & Empirical Experiments
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt || pip install pytest numpy tabulate scipy

      - name: Run Pytest Test Suite
        run: pytest tests/ -v

      - name: Run Deterministic Empirical Benchmark Harness
        run: python run_experiments.py --backend mock

  paper-verification:
    name: Verify Paper Compilation & Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Paper PDF Integrity
        run: |
          if [ ! -f "paper/coderobust_paper.pdf" ]; then
            echo "::error::paper/coderobust_paper.pdf does not exist!"
            exit 1
          fi
          FILE_SIZE=$(wc -c < "paper/coderobust_paper.pdf")
          if [ "$FILE_SIZE" -lt 50000 ]; then
            echo "::error::paper/coderobust_paper.pdf is unexpectedly small ($FILE_SIZE bytes)!"
            exit 1
          fi
          echo "Paper PDF validated successfully. Size: $FILE_SIZE bytes."

  release:
    name: Publish Paper PDF Release Asset
    needs: [test, paper-verification]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Upload Paper PDF to Release
        uses: softprops/action-gh-release@v2
        with:
          files: paper/coderobust_paper.pdf
          generate_release_notes: true
